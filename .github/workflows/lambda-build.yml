name: "Lambda Build Validation"

on:
  push:
    branches: [ feature/base-gep-foundation]
  pull_request:

jobs:
  build-and-package:
    name: "Build Node.js Lambda"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install
        working-directory: ./services/entity-management

      - name: Run Build Script
        working-directory: ./services/entity-management
        run: |

         npm run build 
       
      - name: Upload Entity Management Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package-entity-management
          path: services/entity-management/build/handler.zip
          retention-days: 1

      - name: Build Compliance Agent
        run: |
          cd services/compliance-agent
          npm ci || true
          npm run build || (mkdir -p build && zip -r build/handler.zip index.mjs handlers/ package.json)

      - name: Upload Compliance Agent Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package-compliance-agent
          path: services/compliance-agent/build/handler.zip
          retention-days: 1